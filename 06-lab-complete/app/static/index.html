<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 12px; color: #666; }

    #status {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: #1e3a1e;
      color: #4caf50;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: #555;
      font-size: 12px;
      border: none;
      padding: 4px;
    }

    .typing {
      align-self: flex-start;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      color: #666;
      font-size: 14px;
    }

    footer {
      padding: 16px 24px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
    }

    .api-key-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .api-key-row input {
      flex: 1;
      padding: 8px 12px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 13px;
    }

    .api-key-row button {
      padding: 8px 14px;
      background: #333;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 14px;
      resize: none;
      height: 48px;
      line-height: 24px;
    }

    #input:focus { outline: none; border-color: #2563eb; }

    #send {
      padding: 0 20px;
      background: #2563eb;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send:hover { background: #1d4ed8; }
    #send:disabled { background: #333; cursor: not-allowed; }

    #clear {
      padding: 0 14px;
      background: #333;
      border: 1px solid #444;
      border-radius: 10px;
      color: #aaa;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>AI Chat Agent</h1>
    <span>GPT-4o-mini · Day 12 Lab</span>
  </div>
  <div id="status">● online</div>
</header>

<div id="messages">
  <div class="msg system">Bắt đầu chat nào!</div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Nhập tin nhắn... (Enter để gửi)"></textarea>
    <button id="send" onclick="sendMessage()">Gửi</button>
    <button id="clear" onclick="clearChat()">Xoá</button>
  </div>
</footer>

<script>
  const SESSION_ID = "session-" + Math.random().toString(36).slice(2, 8);
  let userOpenAIKey = localStorage.getItem("user_openai_key") || "";

  // Hỏi key ngay khi load nếu chưa có
  window.addEventListener("load", () => {
    if (!userOpenAIKey) {
      showKeyModal((key) => {
        if (key) {
          userOpenAIKey = key;
          localStorage.setItem("user_openai_key", key);
          addMsg("system", "Đã lưu key. Bắt đầu chat nào!");
        } else {
          userOpenAIKey = "__mock__";
          addMsg("system", "Dùng mock LLM. Gõ tin nhắn để thử.");
        }
      });
    }
  });

  // ── Modal ──────────────────────────────────────────────
  function showKeyModal(onConfirm) {
    const overlay = document.createElement("div");
    overlay.id = "modal-overlay";
    overlay.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,0.7);
      display:flex;align-items:center;justify-content:center;z-index:999;
    `;
    overlay.innerHTML = `
      <div style="background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:24px;width:360px;">
        <p style="margin-bottom:12px;font-size:15px;">OpenAI API không khả dụng.<br>Bạn có muốn nhập API key của mình không?</p>
        <input id="modal-key" type="password" placeholder="sk-..." style="
          width:100%;padding:10px;background:#0f0f0f;border:1px solid #333;
          border-radius:8px;color:#e0e0e0;font-size:13px;margin-bottom:12px;
        "/>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button id="modal-skip" style="padding:8px 16px;background:#333;border:none;border-radius:8px;color:#aaa;cursor:pointer;">
            Không, dùng mock
          </button>
          <button id="modal-confirm" style="padding:8px 16px;background:#2563eb;border:none;border-radius:8px;color:#fff;cursor:pointer;">
            Xác nhận
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById("modal-confirm").onclick = () => {
      const key = document.getElementById("modal-key").value.trim();
      overlay.remove();
      onConfirm(key);
    };
    document.getElementById("modal-skip").onclick = () => {
      overlay.remove();
      onConfirm("");
    };
  }

  function addMsg(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    const msgs = document.getElementById("messages");
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.textContent = "Đang trả lời...";
    document.getElementById("messages").appendChild(div);
    document.getElementById("messages").scrollTop = 99999;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById("input");
    const msg = input.value.trim();
    if (!msg) return;

    input.value = "";
    document.getElementById("send").disabled = true;
    addMsg("user", msg);
    const typing = addTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, session_id: SESSION_ID, openai_key: userOpenAIKey }),
      });

      typing.remove();

      if (res.status === 503) {
        const err = await res.json();
        if (err.detail === "openai_unavailable") {
          // Hỏi user có muốn nhập key không
          showKeyModal((key) => {
            document.getElementById("send").disabled = false;
            if (key) {
              userOpenAIKey = key;
              localStorage.setItem("user_openai_key", key);
              addMsg("system", "Đã lưu key. Đang gửi lại...");
            } else {
              // User chọn không → dùng mock, gửi lại với flag
              userOpenAIKey = "__mock__";
            }
            input.value = msg;
            sendMessage();
          });
          return;
        }
        addMsg("system", "Lỗi 503: " + (err.detail || "Server error"));
      } else if (!res.ok) {
        const err = await res.json();
        addMsg("system", "Lỗi " + res.status + ": " + (err.detail || "Unknown error"));
      } else {
        const data = await res.json();
        addMsg("assistant", data.reply);
      }
    } catch (e) {
      typing.remove();
      addMsg("system", "Không kết nối được server.");
    }

    document.getElementById("send").disabled = false;
    input.focus();
  }

  async function clearChat() {
    await fetch("/chat/" + SESSION_ID, { method: "DELETE" });
    document.getElementById("messages").innerHTML = '<div class="msg system">Đã xoá lịch sử chat.</div>';
  }

  document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
